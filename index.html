<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root{
    /* brand: deep berry, warm neutrals — a studio palette, not a Trinks copy */
    --rose:#8e2347; --rose-dark:#5c1530; --rose-light:#f6e3ea;
    --cream:#fbf8f6; --ink:#241a1f; --ink-soft:#6e5c62;
    --green:#2e7d52; --amber:#9c7a2e; --amber-light:#f7efdc; --amber-border:#e6d3a0;
    --danger:#ae3b3b; --danger-light:#fbeaea; --danger-border:#e3bcbc;
    --hairline:#efe4e1; --muted:#8c6e64; --surface:#ffffff;
  }
  *{box-sizing:border-box;}
  :root{ color-scheme: light; }
  html,body{background:var(--cream); color:var(--ink); font-family:'Work Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; margin:0;}
  input, textarea, select{ background:var(--surface); color:var(--ink); color-scheme:light; border-color:var(--hairline); }
  input::placeholder, textarea::placeholder{ color:var(--ink-soft); opacity:.7; }
  h1,h2{font-family:'Fraunces',Georgia,serif; letter-spacing:-0.01em;}
  .tap{-webkit-tap-highlight-color:transparent; user-select:none;}
  .btn-big{min-height:60px;}
  .digits{font-variant-numeric:tabular-nums; font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;}
  .chip{transition:all .12s ease; border-radius:999px;}
  .chip.active{background:var(--rose); color:white; border-color:var(--rose);}
  .bar-bg{background:var(--hairline); border-radius:999px; overflow:hidden; height:8px;}
  .bar-fill{height:100%; border-radius:999px; transition:width .3s ease;}
  ::-webkit-scrollbar{display:none;}
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0;}
  /* kill the tracked-caps eyebrow look; read as a quiet section label instead */
  .uppercase.tracking-wide{ text-transform:none; letter-spacing:normal; font-weight:600; color:var(--ink-soft); }
  .badge{display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:600; padding:2px 8px; border-radius:999px;}
  .badge-good{background:#e4f1e9; color:var(--green);}
  .badge-warn{background:var(--danger-light); color:var(--danger);}
  .icon-sq{display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;}
  .bottom-nav{position:fixed; left:0; right:0; bottom:0; background:var(--surface); border-top:1px solid var(--hairline);
    display:flex; justify-content:space-around; padding:6px 4px calc(6px + env(safe-area-inset-bottom)); z-index:50; max-width:448px; margin:0 auto;}
  .bottom-nav button{display:flex; flex-direction:column; align-items:center; gap:1px; font-size:9.5px; color:var(--ink-soft);
    background:none; border:none; padding:4px 1px; flex:1; min-width:0; white-space:nowrap;}
  .bottom-nav button .icon{width:26px; height:20px; display:flex; align-items:center; justify-content:center; border-radius:9px; transition:background .15s ease;}
  .bottom-nav button.active{color:var(--rose-dark); font-weight:600;}
  .bottom-nav button.active .icon{background:var(--rose-light);}
  .toast{position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom)); transform:translateX(-50%); max-width:420px; width:calc(100% - 32px);
    background:#3a1220; color:#fff; font-size:13px; padding:10px 14px; border-radius:12px; z-index:80; text-align:center; transition:opacity .35s ease;}
  .toast-out{opacity:0;}
  .sync-dot{position:fixed; top:calc(8px + env(safe-area-inset-top)); right:10px; z-index:60; font-size:10.5px; color:var(--ink-soft);
    background:var(--surface); border:1px solid var(--hairline); border-radius:999px; padding:2px 8px; display:flex; align-items:center; gap:5px;}
  .sync-dot span{width:7px; height:7px; border-radius:50%; display:inline-block;}
</style>
</head>
<body class="min-h-screen pb-24">
<div id="app" class="max-w-md mx-auto px-4 pt-6 pb-10"></div>

<script>
// ---------- dados base ----------
const SERVICES = [
  {id:'mecha_morena', label:'Mechas (morena iluminada)', cat:'Cabelo', prices:[400,450,500,550], defaultPartner:150, estimatedMin:330},
  {id:'mecha_loira',  label:'Mechas loiras',              cat:'Cabelo', prices:[500,550,600,650], defaultPartner:150, estimatedMin:330},
  {id:'escova',       label:'Escova',                      cat:'Cabelo', prices:[65,60,70,75,85], defaultPartner:29.25, studioPct:35, estimatedMin:45},
  {id:'coloracao_raiz',label:'Coloração de raiz',          cat:'Cabelo', prices:[130], defaultPartner:52, studioPct:35, estimatedMin:90},
  {id:'corte',        label:'Corte',                       cat:'Cabelo', prices:[65], defaultPartner:29.25, studioPct:25, estimatedMin:45},
  {id:'tratamento',   label:'Tratamento',                  cat:'Cabelo', prices:[75,100,150,200], estimatedMin:60},
  {id:'trat_wella',   label:'Tratamento Wella / L\'Oréal / Redken', cat:'Cabelo', prices:[80], defaultPartner:36, studioPct:35, estimatedMin:60},
  {id:'trat_kerastase',label:'Tratamento Kérastase',       cat:'Cabelo', prices:[120], defaultPartner:54, studioPct:35, estimatedMin:60},
  {id:'trat_escova_wella',label:'Tratamento + Escova Wella / L\'Oréal / Redken', cat:'Cabelo', prices:[140], defaultPartner:56, studioPct:35, estimatedMin:90},
  {id:'trat_escova_kerastase',label:'Tratamento + Escova Kérastase', cat:'Cabelo', prices:[210], defaultPartner:84, studioPct:35, estimatedMin:90},
  {id:'progressiva',  label:'Progressiva/alisamento (parceira)', cat:'Cabelo', prices:[], commissionType:'percent40', estimatedMin:240},
  {id:'design',       label:'Design de sobrancelhas',      cat:'Sobrancelhas e cílios', prices:[37], estimatedMin:40},
  {id:'bucco',        label:'Buço',                        cat:'Sobrancelhas e cílios', prices:[17], estimatedMin:15},
  {id:'lamination',   label:'Brow lamination',             cat:'Sobrancelhas e cílios', prices:[100], estimatedMin:60},
  {id:'lash',         label:'Lash lifting',                cat:'Sobrancelhas e cílios', prices:[120], estimatedMin:70},
  {id:'colorsobr',    label:'Coloração de sobrancelhas',   cat:'Sobrancelhas e cílios', prices:[32], estimatedMin:20},
  {id:'henna',        label:'Henna',                       cat:'Sobrancelhas e cílios', prices:[27], estimatedMin:20},
  {id:'outro',        label:'Outro serviço',                cat:'Outro', prices:[], estimatedMin:60},
];
function studioPctFor(id){ const sv=(typeof serviceById==='function')?serviceById(id):null; return (sv && sv.studioPct>0) ? sv.studioPct : (config.comissaoProfissionalPercent||0); }
const SERVICES_BASE = SERVICES.map(x=>JSON.parse(JSON.stringify(x)));
let __svcCfgKey = '';
function applyServiceConfig(){
  const ed = (typeof config!=='undefined' && config.servicosEdit) || {};
  const nv = (typeof config!=='undefined' && config.servicosNovos) || [];
  const key = JSON.stringify([ed,nv]);
  if(key===__svcCfgKey) return; __svcCfgKey=key;
  const out = SERVICES_BASE.map(b=>{
    const x = JSON.parse(JSON.stringify(b)); const e = ed[b.id];
    if(e){
      if(e.label) x.label=e.label;
      if(Array.isArray(e.prices)) x.prices=e.prices;
      if(e.estimatedMin>0) x.estimatedMin=e.estimatedMin;
      if(e.defaultPartner!==undefined && e.defaultPartner!==null) x.defaultPartner=e.defaultPartner;
      if(e.studioPct!==undefined && e.studioPct!==null) x.studioPct=e.studioPct;
    }
    return x;
  });
  const outro = out.findIndex(x=>x.id==='outro');
  const extras = nv.map(n=>({id:n.id, label:n.label, cat:n.cat||'Outro', prices:n.prices||[], estimatedMin:n.estimatedMin||60, custom:true}));
  if(outro>=0) out.splice(outro,0,...extras); else out.push(...extras);
  SERVICES.length=0; out.forEach(x=>SERVICES.push(x));
}
const COST_CHIPS = [0,10,20,30,50,70,100,150];
const DEFAULT_CONFIG = {
  custosFixos:1315, metaMin:4000, metaMax:5000, retiradaMin:2000, retiradaMax:3000,
  reactivationTemplate: 'Oi {nome}! Tudo bem? Faz tempo que a gente não se vê por aqui no Studio Avlis 💕 Separei um horário especial pra você — quer agendar um retoque?',
  reminderTemplate: 'Oi {nome}! Passando pra lembrar do seu horário amanhã às {hora} ({servico}) aqui no Studio Avlis 💕 Te espero!',
  pontosPorReal: 10,
  birthdayTemplate: 'Feliz aniversário, {nome}! 🎉 Que seu dia seja lindo! Separei um carinho especial pra quando você vier fazer {servico_favorito} aqui no Studio Avlis.',
  routineTemplate: 'Oi {nome}! Já faz {dias} dias desde seu(sua) {servico} — bora agendar o próximo pra manter tudo em dia? Me fala o melhor horário pra você 💕',
  rotinaAvisoDias: 5,
  nomeProfissional: 'Profissional', comissaoProfissionalPercent: 30,
  donaPin: '0810',
  lastBackupAt: 0,
  servicosEdit: {},
  servicosNovos: [],
  padroesInsumo: {},
  whatsappProfissional: '',
  cobrarInsumosClientesDela: true,
  lembreteDiaTemplate: 'Oi {nome}! Passando pra lembrar do seu horário {dia} às {hora} ({servico}) aqui no Studio Avlis 💕 Me confirma?',
};
const PAYMENT_METHODS = ['Dinheiro','Cartão débito','Cartão crédito','Pix','Outro'];

// ---------- estado ----------
let db = null;
let usingLocal = false;
let records = [];
let clients = [];
let agendamentos = [];
let custos = [];
let estoque = [];
let config = Object.assign({}, DEFAULT_CONFIG);

function isOwnerUnlocked(){ try{ return localStorage.getItem('avlis_owner_unlocked')==='1'; }catch(e){ return false; } }
function setOwnerUnlocked(){ try{ localStorage.setItem('avlis_owner_unlocked','1'); }catch(e){} }
const AUTH_MODE = !!(typeof window!=='undefined' && window.FIREBASE_CONFIG && window.FIREBASE_CONFIG.apiKey);
function detectInitialRole(){
  if(AUTH_MODE) return 'auth';
  try{
    const h = (location.hash||'').replace('#','').toLowerCase().trim();
    if(h==='profissional' || h==='equipe' || h==='agenda-profissional'){ saveRole('pro'); return 'pro'; }
  }catch(e){}
  try{ if((location.hash||'').toLowerCase()==='#dona'){ localStorage.removeItem('avlis_role'); } }catch(e){}
  if(loadRole()==='pro') return 'pro';
  if(isOwnerUnlocked()) return 'owner';
  return 'locked';
}
const INITIAL_ROLE = detectInitialRole();
let state = {
  screen: INITIAL_ROLE==='auth' ? 'loading' : (INITIAL_ROLE==='pro' ? 'pro-home' : (INITIAL_ROLE==='owner' ? 'home' : 'pin-lock')),
  role: (INITIAL_ROLE==='locked'||INITIAL_ROLE==='auth') ? null : INITIAL_ROLE,
  loginError:'', userEmail:'', novoAcesso:{email:'',papel:'profissional'},
  pinInput: '', pinError: false,
  service: null,
  timer: { status:'idle', startedAt:null, accumulated:0, stockUsage:[], insumoSelectedId:null, insumoQty:'', showInsumoForm:false },
  tickHandle: null,
  finishStep: 'client',
  financeMonthOffset: 0,
  editingConfig: false,
  pendingAgendamento: null,
  reportsPeriod: '30d',
  clientsExpandedId: null,
  newRoutine: { serviceId:null, frequencyDays:'', lastDoneAt:'' },
  newCusto: { label:'', value:'' },
  newEstoque: { nome:'', validade:'', valorPago:'', quantidadeTotal:'', unidade:'g', limiteMinimo:'' },
  showEstoqueForm: false,
  agenda: { date: todayKeyNow(), mode:'day', view:'grid', selectedId:null, formOpen:false, clientId:null, clientName:'', clientSearch:'', showNewClientForm:false, serviceIds:[], startTime:'09:00', durationMin:60, clienteDaProfissional:false },
  draft: {
    clientId:null, clientName:'', clientWhatsapp:'', clientSearch:'', showNewClientForm:false,
    suggestion:null, lastVisitInfo:null,
    price:null, customPrice:'', productCost:0, customCost:'',
    partnerCost:0, partnerCostManual:false, note:'',
    paymentMethod:null, extraItems:[], extraLabel:'', extraPrice:'',
    stockUsage:[], stockUsageSelectedId:null, stockUsageQty:'',
  },
};
function localKey(d){ d=(d instanceof Date)?d:new Date(d); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function todayKeyNow(){ return localKey(new Date()); }

// ---------- persistência ----------
function loadLocalRecords(){ try{ const raw=localStorage.getItem('avlis_atendimentos'); records = raw?JSON.parse(raw):[]; }catch(e){ records=[]; } }
function saveLocalRecords(){ try{ localStorage.setItem('avlis_atendimentos', JSON.stringify(records)); }catch(e){} }
function loadLocalClients(){ try{ const raw=localStorage.getItem('avlis_clientes'); clients = raw?JSON.parse(raw):[]; }catch(e){ clients=[]; } }
function saveLocalClients(){ try{ localStorage.setItem('avlis_clientes', JSON.stringify(clients)); }catch(e){} }
function loadRole(){ try{ return localStorage.getItem('avlis_role')||null; }catch(e){ return null; } }
function saveRole(r){ try{ localStorage.setItem('avlis_role', r); }catch(e){} }
function exitProMode(){
  try{ localStorage.removeItem('avlis_role'); }catch(e){}
  state.role=null; state.screen='pin-lock'; state.pinInput=''; state.pinError=false; render();
}
function setPinDigit(v){ state.pinInput = (v||'').replace(/\D/g,'').slice(0,4); state.pinError=false; render(); }
function checkPin(){
  if(state.pinInput.length===4 && state.pinInput === String(config.donaPin||'0000')){
    setOwnerUnlocked(); saveRole('owner'); state.role='owner'; state.screen='home'; state.pinInput=''; state.pinError=false; render();
  } else {
    state.pinInput=''; state.pinError=true; render();
  }
}
function loadLocalConfig(){ try{ const raw=localStorage.getItem('avlis_config'); if(raw) config=Object.assign({},DEFAULT_CONFIG,JSON.parse(raw)); }catch(e){} }
function saveLocalConfig(){ try{ localStorage.setItem('avlis_config', JSON.stringify(config)); }catch(e){} }
function loadLocalAgendamentos(){ try{ const raw=localStorage.getItem('avlis_agendamentos'); agendamentos = raw?JSON.parse(raw):[]; }catch(e){ agendamentos=[]; } }
function saveLocalAgendamentos(){ try{ localStorage.setItem('avlis_agendamentos', JSON.stringify(agendamentos)); }catch(e){} }
function loadLocalCustos(){ try{ const raw=localStorage.getItem('avlis_custos'); custos = raw?JSON.parse(raw):[]; }catch(e){ custos=[]; } }
function saveLocalCustos(){ try{ localStorage.setItem('avlis_custos', JSON.stringify(custos)); }catch(e){} }
function loadLocalEstoque(){ try{ const raw=localStorage.getItem('avlis_estoque'); estoque = raw?JSON.parse(raw):[]; }catch(e){ estoque=[]; } }
function saveLocalEstoque(){ try{ localStorage.setItem('avlis_estoque', JSON.stringify(estoque)); }catch(e){} }

let unsubs = [];
let acessos = [];
function stopListeners(){
  unsubs.forEach(f=>{ try{ f(); }catch(e){} }); unsubs=[];
  records=[]; clients=[]; agendamentos=[]; custos=[]; estoque=[]; acessos=[];
  window.__syncPending = {};
}
function listen(name, ref, apply){
  try{
    const watch = !!window.__syncWatch;
    let first = true;
    const cb = snap=>{
      const changed = first || !watch || (snap.docChanges ? snap.docChanges().length>0 : true);
      first = false;
      apply(snap);
      if(watch && snap.metadata){ window.__syncPending[name] = snap.metadata.hasPendingWrites; }
      if(changed) render(); else renderSyncDot();
    };
    const u = watch ? ref.onSnapshot({includeMetadataChanges:true}, cb, ()=>{}) : ref.onSnapshot(cb, ()=>{});
    if(typeof u==='function') unsubs.push(u);
  }catch(e){}
}
function startListeners(role){
  stopListeners();
  const isPro = role==='pro';
  const col = n=>db.collection(n);
  const mapDocs = snap=>snap.docs.map(d=>({id:d.id, ...d.data()}));
  listen('atendimentos', (AUTH_MODE&&isPro) ? col('atendimentos').where('performedBy','==','pro') : col('atendimentos'),
    snap=>{ records = mapDocs(snap).sort((a,b)=>(b.startedAt||0)-(a.startedAt||0)); });
  listen('clientes', col('clientes'), snap=>{ clients = mapDocs(snap); });
  listen('agendamentos', col('agendamentos'), snap=>{ agendamentos = mapDocs(snap); });
  listen('estoque', col('estoque'), snap=>{ estoque = mapDocs(snap); });
  if(!isPro){
    listen('custos', col('custos'), snap=>{ custos = mapDocs(snap); });
    listen('config', db.doc('config/geral'), snap=>{
      const data = snap && typeof snap.data === 'function' ? snap.data() : null;
      if(data) config = Object.assign({}, DEFAULT_CONFIG, data);
    });
    if(AUTH_MODE) listen('acesso', col('acesso'), snap=>{ acessos = mapDocs(snap); });
  }
}
function papelCacheKey(email){ return 'avlis_papel_'+email; }
async function resolvePapel(email){
  if((window.OWNER_EMAILS||[]).map(e=>e.toLowerCase()).includes(email)) return 'dona';
  try{
    const d = await db.doc('acesso/'+email).get();
    const papel = d.exists ? (d.data().papel||'profissional') : 'nenhum';
    try{ localStorage.setItem(papelCacheKey(email), papel); }catch(e){}
    return papel;
  }catch(e){
    try{ return localStorage.getItem(papelCacheKey(email)) || 'nenhum'; }catch(e2){ return 'nenhum'; }
  }
}
async function handleAuth(user){
  if(!user){
    stopListeners(); state.role=null; state.userEmail=''; state.screen='login'; render(); return;
  }
  const email = (user.email||'').toLowerCase();
  state.userEmail = email;
  const papel = await resolvePapel(email);
  if(papel==='dona'){
    state.role='owner'; state.screen = (state.screen==='loading'||state.screen==='login'||state.screen==='denied') ? 'home' : state.screen;
    startListeners('owner');
  } else if(papel==='profissional'){
    state.role='pro'; state.screen = (state.screen==='loading'||state.screen==='login'||state.screen==='denied') ? 'pro-home' : state.screen;
    startListeners('pro');
  } else {
    stopListeners(); state.role=null; state.screen='denied';
  }
  render();
}
function loginGoogle(){
  state.loginError=''; render();
  const auth = firebase.auth();
  const prov = new firebase.auth.GoogleAuthProvider(); prov.setCustomParameters({prompt:'select_account'});
  auth.signInWithPopup(prov).catch(e=>{
    const c = e && e.code;
    if(c==='auth/popup-blocked' || c==='auth/operation-not-supported-in-this-environment'){ auth.signInWithRedirect(prov); return; }
    if(c==='auth/popup-closed-by-user' || c==='auth/cancelled-popup-request') return;
    state.loginError = c==='auth/unauthorized-domain' ? 'Este endereço ainda não foi liberado no Firebase (Authentication → Settings → Authorized domains).' : 'Não foi possível entrar ('+(c||'erro')+'). Tente de novo.';
    render();
  });
}
function logout(){
  stopListeners(); state.role=null; state.screen='login'; render();
  try{ firebase.auth().signOut(); }catch(e){}
}
function addAcesso(){
  const email=(state.novoAcesso.email||'').trim().toLowerCase();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ showToast('Digite um e-mail válido.'); return; }
  db.doc('acesso/'+email).set({papel:state.novoAcesso.papel, criadoEm:Date.now()}).catch(()=>showToast('Não foi possível liberar. Tente de novo.'));
  state.novoAcesso.email=''; showToast('Acesso liberado para '+email);
  render();
}
function removeAcesso(email){
  if(!confirm('Tirar o acesso de '+email+'?')) return;
  db.doc('acesso/'+email).delete().catch(()=>{});
  showToast('Acesso removido.');
}
function renderLogin(){
  const wrap=el('div','text-center mt-16');
  wrap.appendChild(el('h1','text-2xl font-bold mb-1','Studio Avlis'));
  wrap.appendChild(el('p','text-sm opacity-60 mb-8','Entre com a sua conta Google para continuar.'));
  const b=bigButton('Entrar com Google','var(--rose)',loginGoogle); b.style.maxWidth='320px'; b.style.margin='0 auto'; wrap.appendChild(b);
  if(state.loginError){ const e=el('p','text-sm mt-4',state.loginError); e.style.color='var(--danger)'; wrap.appendChild(e); }
  return wrap;
}
function renderLoading(){ const w=el('div','text-center mt-24'); w.appendChild(el('p','text-sm opacity-60','Carregando…')); return w; }
function renderDenied(){
  const wrap=el('div','text-center mt-16 px-4');
  wrap.appendChild(el('h1','text-xl font-bold mb-2','Sem acesso ainda'));
  wrap.appendChild(el('p','text-sm opacity-70 mb-6',`A conta ${state.userEmail} ainda não foi liberada. Peça para a dona liberar em Financeiro → Acesso ao app, ou entre com outra conta.`));
  const b=bigButton('Entrar com outra conta','var(--rose)',logout); b.style.maxWidth='320px'; b.style.margin='0 auto'; wrap.appendChild(b);
  return wrap;
}
function renderAcessoCard(){
  const card=el('div','rounded-2xl p-4 mt-4 bg-white shadow-sm'); card.style.border='1px solid var(--rose-light)';
  card.innerHTML = `<p class="text-sm font-semibold mb-1">Acesso ao app</p><p class="text-xs opacity-60 mb-3">Quem pode entrar com Google. “Profissional” vê só a agenda e os próprios atendimentos; “Dona” vê tudo.</p>`;
  const list = el('div','space-y-2 mb-3');
  const logged = state.userEmail;
  const all = [{id:logged, papel:'dona', fixo:true}].concat(acessos.filter(a=>a.id!==logged));
  all.forEach(a=>{
    const row=el('div','flex items-center justify-between text-sm');
    row.innerHTML=`<span style="overflow-wrap:anywhere">${a.id}<br><span class="text-xs opacity-60">${a.papel==='dona'?'Dona':'Profissional'}${a.fixo?' · você':''}</span></span>`;
    if(!a.fixo){ const r=el('button','tap text-xs underline','remover'); r.style.color='var(--danger)'; r.onclick=()=>removeAcesso(a.id); row.appendChild(r); }
    list.appendChild(row);
  });
  card.appendChild(list);

function fmtMoney(v){ return 'R$ ' + (Math.round((v||0)*100)/100).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function fmtClock(ms){
  const totalSec=Math.floor(ms/1000), h=Math.floor(totalSec/3600), m=Math.floor((totalSec%3600)/60), s=totalSec%60;
  const pad=n=>String(n).padStart(2,'0');
  return h>0?`${pad(h)}:${pad(m)}:${pad(s)}`:`${pad(m)}:${pad(s)}`;
}

function fmtDateLabel(key){ const [y,m,d]=key.split('-'); return `${d}/${m}/${y}`; }

function daysSince(ts){ return Math.floor((Date.now()-ts)/86400000); }

function monthLabel(key){ const [y,m]=key.split('-'); const names=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez']; return names[parseInt(m)-1]+'/'+y; }

function addMinutesToTime(hhmm, minutes){
  const total = timeToMinutes(hhmm) + minutes;
  const norm = ((total%1440)+1440)%1440;
  const hh = Math.floor(norm/60), mm = norm%60;
  return String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');
}
function findConflicts(date, startTime, durationMin, excludeId){

function reportsFilterRecords(period){
  const now = Date.now();
  if(period==='month'){ const mk = monthKey(now); return records.filter(r=>monthKey(r.startedAt||r.createdAt)===mk); }
  if(period==='all') return records.slice();
  const days = period==='7d' ? 7 : 30;
  const cutoff = now - days*86400000;
  return records.filter(r=>(r.startedAt||r.createdAt) >= cutoff);
}
// Divide um atendimento em partes, uma por serviço (tempo, valor e custos de cada um).
function explodeRecord(r){
  const dur = r.durationMin||0;
  const sv = (r.servicos||[]).filter(x=>x && x.id);
  if(sv.length<=1){
    return [{rid:r.id, startedAt:r.startedAt||r.createdAt, service:r.service, label:(sv[0]&&sv[0].label)||r.serviceLabel, min:dur, fat:r.price||0, custoProduto:r.productCost||0, custoParceira:r.partnerCost||0, cliente:r.clientName||'', parte:false}];
  }
  const sumMin = sv.reduce((a,x)=>a+(x.min||0),0);
  const mins = sv.map(x=> sumMin>0 ? (x.min||0) : dur/sv.length);
  const items = (r.items||[]).slice();
  const used = new Set(); const fats = sv.map(()=>0);
  sv.forEach((x,i)=>{
    const k = items.findIndex((it,ix)=>!used.has(ix) && (i===0 ? ix===0 : it.label===x.label));
    if(k>=0){ used.add(k); fats[i]=items[k].price||0; }
  });
  items.forEach((it,ix)=>{ if(!used.has(ix)) fats[0]+=it.price||0; });
  const totalMin = mins.reduce((a,b)=>a+b,0)||1;
  return sv.map((x,i)=>({
    rid:r.id, startedAt:r.startedAt||r.createdAt, service:x.id, label:x.label, min:Math.round(mins[i]*10)/10, fat:fats[i],
    custoProduto:(r.productCost||0)*mins[i]/totalMin, custoParceira:i===0?(r.partnerCost||0):0, cliente:r.clientName||'', parte:true
  }));
}
function explodeAll(list){ return list.flatMap(explodeRecord); }
function computeServiceStats(filtered){
  const map = {};
  explodeAll(filtered).forEach(p=>{
    if(!map[p.service]) map[p.service] = {serviceId:p.service, label:p.label, n:0, min:0, fat:0, custoProduto:0, custoParceira:0, minList:[]};
    const s = map[p.service];
    s.n++; s.min += p.min; s.fat += p.fat; s.custoProduto += p.custoProduto; s.custoParceira += p.custoParceira; s.minList.push(p.min);
  });
  return Object.values(map).map(s=>{
    const margem = s.fat - s.custoProduto - s.custoParceira;
    const horas = s.min/60;
    const avgDuration = s.n>0 ? Math.round(s.min/s.n) : 0;
    const minMin = s.minList.length?Math.round(Math.min(...s.minList)):0, maxMin = s.minList.length?Math.round(Math.max(...s.minList)):0;
    return Object.assign(s, {margem, horas, margemHora: horas>0?margem/horas:0, avgDuration, minMin, maxMin});
  }).sort((a,b)=>b.margemHora-a.margemHora);
}
function buildCsv(){
  const header = ['data','hora_inicio','servico','cliente','duracao_min','valor','custo_produto','custo_parceira','margem','atendimento_com_varios_servicos'];
  const rows = explodeAll(records.slice().sort((a,b)=>(a.startedAt||0)-(b.startedAt||0))).map(p=>{
    const d = new Date(p.startedAt);
    const dataStr = fmtDateLabel(todayKey(p.startedAt));
    const horaStr = d.toTimeString().slice(0,5);
    const r2=x=>Math.round(x*100)/100;
    const margem = r2(p.fat-p.custoProduto-p.custoParceira);
    return [dataStr, horaStr, p.label, p.cliente, Math.round(p.min), r2(p.fat), r2(p.custoProduto), r2(p.custoParceira), margem, p.parte?'sim':'não'];
  });
  const csvLines = [header.join(';')].concat(rows.map(row=>row.map(v=>String(v).replace(/;/g,',')).join(';')));
  return csvLines.join('\n');
}

async function importarBackup(text){

  if(!data || data.app!=='studio-avlis'){ showToast('Esse arquivo não é um backup do Studio Avlis.'); return; }
  const cols = {atendimentos:'atendimentos', clientes:'clientes', agendamentos:'agendamentos', custos:'custos', estoque:'estoque'};
  const total = Object.keys(cols).reduce((a,k)=>a+((data[k]||[]).length),0);
  if(!confirm(`Importar ${total} registros desse backup? Os que já existem com o mesmo código são atualizados; nada é apagado.`)) return;
  showToast('Importando… não feche o app.');
  const locals = {atendimentos:()=>records, clientes:()=>clients, agendamentos:()=>agendamentos, custos:()=>custos, estoque:()=>estoque};
  for(const k of Object.keys(cols)){
    const list = data[k]||[];
    if(db && !usingLocal){
      for(let i=0;i<list.length;i+=50){
        await Promise.all(list.slice(i,i+50).filter(d=>d&&d.id).map(d=>db.collection(cols[k]).doc(d.id).set(stripId(d)).catch(()=>{})));
      }
    } else {
      const arr = locals[k]();
      list.forEach(d=>{ if(!d||!d.id) return; const i=arr.findIndex(x=>x.id===d.id); if(i>=0) arr[i]=d; else arr.push(d); });
    }
  }
  if(usingLocal){ saveLocalRecords(); saveLocalClients(); saveLocalAgendamentos(); saveLocalCustos(); saveLocalEstoque(); }
  if(data.config){
    const patch={};
    Object.keys(data.config).forEach(key=>{ if(key==='donaPin'||key==='lastBackupAt') return; if(config[key]===undefined || JSON.stringify(config[key])===JSON.stringify(DEFAULT_CONFIG[key])) patch[key]=data.config[key]; });
    if(Object.keys(patch).length) saveConfig(patch);
  }
  render();

}

async function getGcal(){ try{ if(typeof claude==='undefined') return null; const mcp = await claude.use('mcp'); return mcp||null; }catch(e){ return null; } }
async function pushAgendamentoToGoogle(ag){
  try{
    const mcp = await getGcal(); if(!mcp) return;
    const startISO = ag.date+'T'+ag.startTime+':00';
    const endISO = ag.date+'T'+ag.endTime+':00';
    const result = await mcp.callTool('Google Calendar','create_event', {
      summary: (ag.clientName||'Cliente')+' - '+ag.serviceLabel,
      description: ag.note||'', startTime: startISO, endTime: endISO, timeZone:'America/Sao_Paulo',
    });
    const payload = result && result.payload;
    const eventId = payload && (payload.id || payload.eventId);
    if(eventId){
      if(db && !usingLocal){ db.collection('agendamentos').doc(ag.id).update({googleEventId:eventId}).catch(()=>{}); }
      const a=agendamentos.find(a=>a.id===ag.id); if(a){ a.googleEventId=eventId; if(usingLocal) saveLocalAgendamentos(); }
    }
  }catch(e){ /* sem Google Calendar conectado nesta sessão, ou chamada falhou — segue só local */ }
}
async function deleteAgendamentoFromGoogle(ag){
  try{
    if(!ag || !ag.googleEventId) return;
    const mcp = await getGcal(); if(!mcp) return;
    await mcp.callTool('Google Calendar','delete_event', {eventId: ag.googleEventId});
  }catch(e){}
}

  const ids = (ag.serviceIds && ag.serviceIds.length) ? ag.serviceIds : [ag.service];
  const svc = serviceById(ids[0]) || serviceById(ag.service);
  state.pendingAgendamento = ag;
  if(db && !usingLocal){ db.collection('agendamentos').doc(ag.id).update({status:'em_atendimento'}).catch(()=>{}); }
  ag.status='em_atendimento';
  pickService(svc, ids);

function icon(name, size){
  size = size||18;
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]||''}</svg>`;
}
function iconLabel(name, text, color){
  return `<span class="flex items-center gap-2" style="color:${color||'inherit'}"><span class="icon-sq" style="color:${color||'var(--rose)'}">${icon(name,16)}</span>${text}</span>`;
}
function showToast(msg){
  try{
    const old=document.getElementById('toast'); if(old) old.remove();
    const t=document.createElement('div'); t.id='toast'; t.className='toast'; t.textContent=msg;
    document.body.appendChild(t);
    setTimeout(()=>{ t.classList.add('toast-out'); setTimeout(()=>t.remove(),400); }, 2800);
  }catch(e){}
}
function savedToast(what){ showToast(navigator.onLine===false ? what+' no celular — vai sincronizar quando a internet voltar' : what); }
window.__syncPending = window.__syncPending || {};
function syncStatus(){
  if(!window.__syncWatch) return null;
  if(navigator.onLine===false) return 'offline';
  return Object.values(window.__syncPending).some(Boolean) ? 'pending' : 'ok';
}
function renderSyncDot(){
  const old=document.getElementById('sync-dot'); if(old) old.remove();
  const s=syncStatus(); if(!s) return;
  const map={ ok:['sincronizado','#2f7d4f'], pending:['enviando…','#b7791f'], offline:['sem internet · salvo no celular','#b7791f'] };
  const d=document.createElement('div'); d.id='sync-dot'; d.className='sync-dot';
  d.innerHTML=`<span style="background:${map[s][1]}"></span>${map[s][0]}`;
  document.body.appendChild(d);
}
window.addEventListener('online', ()=>renderSyncDot());
window.addEventListener('offline', ()=>renderSyncDot());
function el(tag,cls,html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!==undefined) e.innerHTML=html; return e; }

function renderHistory(){

  records.forEach(r=>{ const k=todayKey(r.startedAt||r.createdAt); (byDay[k]=byDay[k]||[]).push(r); });
  Object.keys(byDay).sort().reverse().forEach(day=>{
    const dayRecs=byDay[day], t=dayTotals(dayRecs);

    wrap.appendChild(el('p','text-xs opacity-60 mb-2',
      `${t.n} atend. · ${t.horas.toFixed(1)}h · faturado ${fmtMoney(t.fat)} · margem ${fmtMoney(t.margem)}${t.horas>0?' · '+fmtMoney(t.margemHora)+'/h':''}`));

function toggleClientExpanded(id){ state.clientsExpandedId = state.clientsExpandedId===id ? null : id; state.newRoutine={serviceId:null,frequencyDays:'',lastDoneAt:''}; render(); }
function setClientField(id, field, value){ updateClient(id, {[field]:value}); }
function setNewRoutineService(id){ state.newRoutine.serviceId=id; render(); }
function setNewRoutineFreq(v){ state.newRoutine.frequencyDays=v; }
function setNewRoutineLastDone(v){ state.newRoutine.lastDoneAt=v; }
function submitNewRoutine(clientId){
  const svc = serviceById(state.newRoutine.serviceId);
  const freq = parseInt(state.newRoutine.frequencyDays,10);
  if(!svc || !freq) return;
  const lastDoneMs = state.newRoutine.lastDoneAt ? new Date(state.newRoutine.lastDoneAt+'T12:00:00').getTime() : Date.now();
  addRoutine(clientId, svc.id, svc.label, freq, lastDoneMs);
  state.newRoutine = {serviceId:null, frequencyDays:'', lastDoneAt:''};
}

function progressBar(value, min, max, colorVar){
  const pct = max>0 ? Math.min(100, Math.round((value/max)*100)) : 0;
  const minPct = max>0 ? Math.min(100, Math.round((min/max)*100)) : 0;
  const wrap = el('div','mb-1');
  const bar = el('div','bar-bg relative');
  bar.style.position='relative';
  const fill = el('div','bar-fill'); fill.style.width = pct+'%'; fill.style.background = colorVar;
  bar.appendChild(fill);
  const marker = el('div'); marker.style.position='absolute'; marker.style.left=minPct+'%'; marker.style.top='0'; marker.style.bottom='0';
  marker.style.width='2px'; marker.style.background='var(--ink-soft)';
  bar.appendChild(marker);
  wrap.appendChild(bar);
  return wrap;
}

function parsePrices(txt){
  return String(txt||'').split(/[;\/\s]+/).map(x=>parseFloat(x.replace(',','.'))).filter(x=>x>0);
}
function saveServicos(){
  const g=id=>{ const e=document.getElementById(id); return e?e.value:''; };
  const ed={};
  SERVICES_BASE.forEach(b=>{
    const label=g('sv-label-'+b.id).trim()||b.label;
    const prices=parsePrices(g('sv-prices-'+b.id));
    const min=parseInt(g('sv-min-'+b.id))||b.estimatedMin;
    const partTxt=g('sv-part-'+b.id).trim();
    const entry={};
    if(label!==b.label) entry.label=label;
    if(JSON.stringify(prices)!==JSON.stringify(b.prices||[])) entry.prices=prices;
    if(min!==b.estimatedMin) entry.estimatedMin=min;
    if(partTxt!==''){ const v=parseFloat(partTxt.replace(',','.')); if(!isNaN(v) && v!==(b.defaultPartner||0)) entry.defaultPartner=v; }
    const pctTxt=g('sv-pct-'+b.id).trim();
    if(pctTxt!==''){ const v=parseFloat(pctTxt.replace(',','.')); if(!isNaN(v) && v!==(b.studioPct||0)) entry.studioPct=v; }
    if(Object.keys(entry).length) ed[b.id]=entry;
  });
  const novos=(config.servicosNovos||[]).map(n=>({
    ...n, label:g('svn-label-'+n.id).trim()||n.label, prices:parsePrices(g('svn-prices-'+n.id)), estimatedMin:parseInt(g('svn-min-'+n.id))||n.estimatedMin
  }));
  const nn=g('sv-new-label').trim();
  if(nn){ novos.push({id:'x_'+Date.now().toString(36), label:nn, cat:'Outro', prices:parsePrices(g('sv-new-prices')), estimatedMin:parseInt(g('sv-new-min'))||60}); }
  saveConfig({servicosEdit:ed, servicosNovos:novos});
  showToast('Serviços e valores salvos.');
}

// ---------- padrão de insumos ----------
function custoUnit(itemId){ const it=estoque.find(e=>e.id===itemId); return it && it.quantidadeTotal>0 ? (it.valorPago||0)/it.quantidadeTotal : 0; }
function insumoStats(days){
  const since = Date.now()-(days||30)*86400000;
  const stats = {};
  records.filter(r=>(r.startedAt||r.createdAt)>=since && r.stockUsage && r.stockUsage.length).forEach(r=>{
    const who = r.performedBy==='pro' ? 'pro' : 'owner';
    const s = stats[r.service] || (stats[r.service]={serviceId:r.service, label:r.serviceLabel, items:{}});
    const perItem = {};
    r.stockUsage.forEach(u=>{ const k=u.estoqueItemId||u.nome; perItem[k]=perItem[k]||{nome:u.nome, unidade:u.unidade, qty:0}; perItem[k].qty+=u.qty||0; });
    Object.entries(perItem).forEach(([k,v])=>{
      const it = s.items[k] || (s.items[k]={id:k, nome:v.nome, unidade:v.unidade, owner:{sum:0,n:0}, pro:{sum:0,n:0}});
      it[who].sum+=v.qty; it[who].n+=1;
    });
  });
  return stats;
}
function padraoDe(serviceId, itemId){ const p=(config.padroesInsumo||{})[serviceId]; return p && p[itemId] ? p[itemId] : null; }
function setPadrao(serviceId, itemId, v){
  const val = parseFloat(String(v).replace(',','.'));
  const all = JSON.parse(JSON.stringify(config.padroesInsumo||{}));
  all[serviceId] = all[serviceId]||{};
  if(val>0) all[serviceId][itemId]=val; else delete all[serviceId][itemId];
  saveConfig({padroesInsumo:all});
}
function computeInsumoDesvios(){
  const out=[]; const stats=insumoStats(30);
  Object.values(stats).forEach(s=>Object.values(s.items).forEach(it=>{
    const pad=padraoDe(s.serviceId,it.id); if(!pad) return;
    ['owner','pro'].forEach(w=>{ if(!it[w].n) return; const avg=it[w].sum/it[w].n; if(avg>pad*1.15) out.push({service:s.label, item:it.nome, who:w, avg, pad, extra:(avg-pad)*custoUnit(it.id)}); });
  }));
  return out;
}
function insumoBar(label, avg, pad, unidade){
  const max = Math.max(avg, pad||0)*1.15 || 1;
  const over = pad && avg>pad*1.15;
  const row = el('div','flex items-center gap-2 mb-1');
  row.innerHTML = `<span class="text-xs opacity-60" style="width:64px">${label}</span>
    <div style="flex:1;position:relative;height:10px;border-radius:5px;background:var(--rose-light)">
      <div style="width:${Math.min(100,avg/max*100)}%;height:10px;border-radius:5px;background:${over?'var(--danger)':'var(--rose)'}"></div>
      ${pad?`<div style="position:absolute;top:-3px;left:${Math.min(100,pad/max*100)}%;width:2px;height:16px;background:var(--ink)"></div>`:''}
    </div>
    <span class="text-xs" style="width:56px;text-align:right;${over?'color:var(--danger);font-weight:600':''}">${Math.round(avg*10)/10}${unidade}</span>`;
  return row;
}
function renderInsumosPadrao(){
  const wrap=el('div');
  wrap.appendChild(backButton(goEstoque));
  wrap.appendChild(el('h2','text-xl font-bold mb-1','Padrão de insumos'));
  wrap.appendChild(el('p','text-xs opacity-60 mb-4',`Média gasta por atendimento nos últimos 30 dias, sua e da ${config.nomeProfissional}. Defina o padrão de cada produto (a linha preta) e eu aviso quando alguém passar mais de 15% dele.`));
  const desvios = computeInsumoDesvios();
  if(desvios.length){
    const box=el('div','rounded-xl p-3 mb-4'); box.style.background='var(--danger-light)'; box.style.border='1px solid var(--danger-border)';
    box.innerHTML = desvios.map(d=>`<p class="text-xs mb-1" style="color:var(--danger)"><b>${d.item}</b> em ${d.service}: ${d.who==='pro'?config.nomeProfissional:'você'} usa ${Math.round(d.avg*10)/10} (padrão ${d.pad})${d.extra>0?' · ~'+fmtMoney(d.extra)+' a mais por atendimento':''}</p>`).join('');
    wrap.appendChild(box);
  }
  const stats = Object.values(insumoStats(30));
  if(!stats.length){
    wrap.appendChild(el('p','text-sm opacity-60','Ainda não tem atendimento com insumo lançado nos últimos 30 dias. Assim que você ou ela lançarem insumos durante o atendimento, as médias aparecem aqui.'));
    return wrap;
  }
  stats.sort((a,b)=>a.label.localeCompare(b.label)).forEach(s=>{
    const card=el('div','rounded-2xl p-4 mb-3 bg-white shadow-sm'); card.style.border='1px solid var(--rose-light)';
    card.appendChild(el('p','font-semibold text-sm mb-3',s.label));
    Object.values(s.items).forEach(it=>{
      const pad = padraoDe(s.serviceId,it.id);
      const head = el('div','flex items-center justify-between mb-1');
      head.appendChild(el('span','text-xs font-medium',it.nome));
      const padIn = el('input','rounded-lg px-2 py-1 text-xs'); padIn.type='number'; padIn.inputMode='decimal'; padIn.style.width='96px'; padIn.style.border='1px solid var(--rose-light)';
      padIn.placeholder='padrão ('+it.unidade+')'; padIn.value = pad||'';
      padIn.onchange=(e)=>setPadrao(s.serviceId,it.id,e.target.value);
      head.appendChild(padIn);
      card.appendChild(head);
      if(it.owner.n) card.appendChild(insumoBar('Você', it.owner.sum/it.owner.n, pad, it.unidade));
      if(it.pro.n) card.appendChild(insumoBar(config.nomeProfissional.slice(0,10), it.pro.sum/it.pro.n, pad, it.unidade));
      card.appendChild(el('p','text-xs opacity-40 mb-3',`${it.owner.n} seu(s) · ${it.pro.n} dela`));
    });
    wrap.appendChild(card);
  });
  return wrap;
}

// ---------- fechamento da profissional ----------
function fechamentoDoMes(mk){
  const recs = records.filter(r=>r.performedBy==='pro' && monthKey(r.startedAt||r.createdAt)===mk);
  const dela = recs.filter(r=>r.proOwnClient);
  const studio = recs.filter(r=>!r.proOwnClient);
  const sum=(arr,f)=>arr.reduce((a,r)=>a+(f(r)||0),0);
  const pcts = dela.map(r=>studioPctFor(r.service));
  const pct = pcts.length && pcts.every(x=>x===pcts[0]) ? pcts[0] : (pcts.length ? null : (config.comissaoProfissionalPercent||0));
  const fatDela = sum(dela,r=>r.proPrice);
  const comissao = Math.round(dela.reduce((a,r)=>a+(r.proPrice||0)*studioPctFor(r.service)/100,0)*100)/100;
  const insumosDela = sum(dela,r=>r.productCost);
  const insumosStudio = sum(studio,r=>r.productCost);
  const repasse = comissao + (config.cobrarInsumosClientesDela ? insumosDela : 0);
  return { recs, dela, studio, fatDela, comissao, pct, insumosDela, insumosStudio, repasse,
    horasStudio: sum(studio,r=>r.durationMin)/60, horasDela: sum(dela,r=>r.durationMin)/60 };
}
function fechamentoMsg(mk, f){
  const nome = (config.nomeProfissional||'').split(' ')[0];
  let m = `Oi ${nome}! Fechamento de ${monthLabel(mk)} no Studio Avlis:\n\n`;
  m += `Clientes do studio que você atendeu: ${f.studio.length}\n`;
  m += `Suas clientes: ${f.dela.length} (total cobrado ${fmtMoney(f.fatDela)})\n`;
  m += `Comissão do studio${f.pct!==null?' ('+f.pct+'%)':' (por serviço)'}: ${fmtMoney(f.comissao)}\n`;
  if(config.cobrarInsumosClientesDela) m += `Insumos usados nas suas clientes: ${fmtMoney(f.insumosDela)}\n`;
  m += `\nTotal a repassar: ${fmtMoney(f.repasse)}\nQualquer dúvida me fala 💕`;
  return m;
}

const AGENDA_STATUS_MAP = {
  concluido:['concluído','var(--ink-soft)','var(--hairline)','#f4efee'],
  em_atendimento:['em andamento','var(--amber)','var(--amber-border)','var(--amber-light)'],
  confirmado:['confirmado','var(--green)','#bfe0cc','#e4f1e9'],
  faltou:['faltou','var(--danger)','var(--danger-border)','var(--danger-light)'],
  agendado:['agendado','var(--rose-dark)','var(--rose-light)','var(--surface)'],
};

function shiftAgendaPeriod(delta){
  const d=new Date(state.agenda.date+'T00:00:00');
  if(state.agenda.mode==='month') d.setMonth(d.getMonth()+delta);
  else if(state.agenda.mode==='week') d.setDate(d.getDate()+delta*7);
  else d.setDate(d.getDate()+delta);
  state.agenda.date = localKey(d); render();
}
function setAgendaMode(mode){ state.agenda.mode=mode; render(); }
function jumpToAgendaDay(dateStr){ state.agenda.date=dateStr; state.agenda.mode='day'; render(); }
function startOfWeek(dateStr){ const d=new Date(dateStr+'T00:00:00'); const dow=d.getDay(); d.setDate(d.getDate()-dow); return d; }

function renderAgenda(){
  const wrap=el('div');
  if(state.role==='pro'){
    const head=el('div','mb-3');
    head.innerHTML = `<p class="text-lg font-bold">Agenda</p><p class="text-xs opacity-50">Olá, ${config.nomeProfissional} — veja aqui os horários pra não bater com os da Avlis.</p>`;
    wrap.appendChild(head);
  } else {
    wrap.appendChild(backButton(goHome));
  }
  const mode = state.agenda.mode||'day';
  const navRow=el('div','flex items-center justify-between mb-1');
  const navLeft=el('div','flex items-center');
  const prev=el('button','tap text-lg px-2','‹'); prev.onclick=()=>shiftAgendaPeriod(-1);
  const next=el('button','tap text-lg px-2','›'); next.onclick=()=>shiftAgendaPeriod(1);
  const periodLabel = mode==='month' ? monthLabel(state.agenda.date.slice(0,7)) : mode==='week' ? 'Semana de '+fmtDateLabel(localKey(startOfWeek(state.agenda.date))) : weekdayLabel(state.agenda.date);
  const label=el('h2','text-lg font-bold', periodLabel);
  navLeft.appendChild(prev); navLeft.appendChild(label); navLeft.appendChild(next);
  navRow.appendChild(navLeft);
  wrap.appendChild(navRow);

  const modeRow = el('div','flex gap-2 mb-2');
  [['day','Dia'],['week','Semana'],['month','Mês']].forEach(([key,lbl])=>{
    const b=el('button','tap text-xs px-3 py-1.5 rounded-full',lbl);
    if(mode===key){ b.style.background='var(--rose)'; b.style.color='white'; }
    else { b.style.background='var(--rose-light)'; b.style.color='var(--rose-dark)'; }
    b.onclick=()=>setAgendaMode(key);
    modeRow.appendChild(b);
  });
  wrap.appendChild(modeRow);

  const dateRow = el('div','flex items-center gap-2 mb-4');
  if(mode==='day') dateRow.appendChild(el('p','text-xs opacity-50', fmtDateLabel(state.agenda.date)));
  if(gcalAvailable) dateRow.appendChild(el('span','text-xs','<span class="badge badge-good">sincronizado com Google Calendar</span>'));
  wrap.appendChild(dateRow);

  if(mode==='month'){
    wrap.appendChild(renderAgendaMonth());
    return wrap;
  }
  if(mode==='week'){
    wrap.appendChild(renderAgendaWeek());
    return wrap;
  }

  const dayItems = agendamentos.filter(a=>a.date===state.agenda.date && a.status!=='cancelado').sort((a,b)=>timeToMinutes(a.startTime)-timeToMinutes(b.startTime));

  if(state.agenda.formOpen && state.agenda.editingId){ wrap.appendChild(renderAgendaForm()); }
  if(state.agenda.view==='grid'){
    const sel = state.agenda.selectedId ? agendamentos.find(a=>a.id===state.agenda.selectedId) : null;
    if(sel && !state.agenda.editingId){ wrap.appendChild(el('p','text-xs uppercase tracking-wide mb-2','Detalhes do agendamento (toque de novo no horário para fechar)')); wrap.appendChild(renderAgendaItem(sel,true)); }
    wrap.appendChild(renderAgendaGrid(dayItems));
  } else {
    if(!dayItems.length) wrap.appendChild(el('p','text-sm opacity-60 mb-4','Nenhum agendamento nesse dia.'));
    else dayItems.forEach(ag=>wrap.appendChild(renderAgendaItem(ag)));
  }
  const viewBtn=el('button','tap text-xs opacity-50 mb-4 underline', state.agenda.view==='grid'?'ver em lista':'ver em grade');
  viewBtn.onclick=toggleAgendaView;
  wrap.appendChild(viewBtn);

  if(state.agenda.formOpen && state.agenda.editingId){
    // formulário de edição já está no topo
  } else if(!state.agenda.formOpen){
    const addBtn=el('button','tap w-full text-center py-3 rounded-xl text-sm font-medium mt-1','+ Agendar');
    addBtn.style.background='var(--rose)'; addBtn.style.color='white'; addBtn.onclick=toggleAgendaForm;
    wrap.appendChild(addBtn);
  } else {
    wrap.appendChild(renderAgendaForm());
  }
  return wrap;
}

function renderAgendaWeek(){
  const wrap=el('div');
  const start=startOfWeek(state.agenda.date);
  for(let i=0;i<7;i++){
    const d=new Date(start); d.setDate(start.getDate()+i);
    const dateStr=localKey(d);
    const items=agendamentos.filter(a=>a.date===dateStr && a.status!=='cancelado').sort((a,b)=>timeToMinutes(a.startTime)-timeToMinutes(b.startTime));
    const isToday = dateStr===todayKeyNow();
    const card=el('button','tap w-full text-left rounded-xl p-3 mb-2 bg-white shadow-sm');
    card.style.border = isToday ? '1px solid var(--rose)' : '1px solid var(--hairline)';
    card.onclick=()=>jumpToAgendaDay(dateStr);
    const head=el('div','flex items-center justify-between mb-1');
    head.innerHTML=`<span class="text-sm font-semibold" style="color:${isToday?'var(--rose-dark)':'var(--ink)'}">${weekdayLabel(dateStr)}</span><span class="text-xs opacity-50">${items.length} agend.</span>`;
    card.appendChild(head);
    if(items.length){
      const list=el('div','text-xs opacity-70 space-y-0.5');
      items.slice(0,4).forEach(a=>list.appendChild(el('p',null,`${a.startTime} · ${a.clientName||'(sem cliente)'} · ${a.serviceLabel}`)));
      if(items.length>4) list.appendChild(el('p',null,`+${items.length-4} outro(s)`));
      card.appendChild(list);
    } else {
      card.appendChild(el('p','text-xs opacity-40','sem agendamentos'));
    }
    wrap.appendChild(card);
  }
  return wrap;
}

function renderAgendaMonth(){
  const wrap=el('div');
  const mk = state.agenda.date.slice(0,7);
  const firstOfMonth = new Date(mk+'-01T00:00:00');
  const startGrid = new Date(firstOfMonth); startGrid.setDate(startGrid.getDate()-firstOfMonth.getDay());
  const todayStr = todayKeyNow();
  const grid = el('div','grid grid-cols-7 gap-1 mb-3');
  ['D','S','T','Q','Q','S','S'].forEach(d=>grid.appendChild(el('div','text-center text-xs opacity-40 font-medium',d)));
  for(let i=0;i<42;i++){
    const d=new Date(startGrid); d.setDate(startGrid.getDate()+i);
    const dateStr=localKey(d);
    const inMonth = dateStr.slice(0,7)===mk;
    const items=agendamentos.filter(a=>a.date===dateStr && a.status!=='cancelado');
    const isToday = dateStr===todayStr;
    const cell=el('button','tap rounded-lg flex flex-col items-center justify-center');
    cell.style.aspectRatio='1'; cell.style.opacity = inMonth?'1':'0.3';
    cell.style.background = isToday ? 'var(--rose)' : (items.length ? 'var(--rose-light)' : 'transparent');
    cell.style.color = isToday ? 'white' : 'var(--ink)';
    cell.onclick=()=>jumpToAgendaDay(dateStr);
    cell.innerHTML = `<span class="text-xs font-medium">${d.getDate()}</span>${items.length?`<span class="text-[9px]" style="opacity:.8">${items.length}</span>`:''}`;
    grid.appendChild(cell);
  }
  wrap.appendChild(grid);

  const dayItems = agendamentos.filter(a=>a.date===state.agenda.date && a.status!=='cancelado').sort((a,b)=>timeToMinutes(a.startTime)-timeToMinutes(b.startTime));
  wrap.appendChild(el('p','text-xs uppercase tracking-wide mb-2', fmtDateLabel(state.agenda.date)));
  if(!dayItems.length) wrap.appendChild(el('p','text-sm opacity-60 mb-4','Nenhum agendamento nesse dia.'));
  else dayItems.forEach(ag=>wrap.appendChild(renderAgendaItem(ag)));
  return wrap;
}

function renderAgendaGrid(dayItems){
  const HOUR_START=7, HOUR_END=20, ROW_H=52, LABEL_W=38;
  const totalHeight=(HOUR_END-HOUR_START)*ROW_H;
  const outer = el('div','rounded-2xl mb-2 overflow-hidden'); outer.style.border='1px solid var(--hairline)'; outer.style.background='var(--surface)';

  // hour lines + labels (absolute, spanning full width incl label column)
  const gridWrap = el('div'); gridWrap.style.position='relative'; gridWrap.style.height=totalHeight+'px';
  for(let h=HOUR_START; h<=HOUR_END; h++){
    const y=(h-HOUR_START)*ROW_H;
    const lineRow = el('div'); lineRow.style.position='absolute'; lineRow.style.top=y+'px'; lineRow.style.left='0'; lineRow.style.right='0'; lineRow.style.height='1px'; lineRow.style.background='var(--hairline)';
    gridWrap.appendChild(lineRow);
    const lbl = el('span', null, h+'h'); lbl.style.position='absolute'; lbl.style.top=(y-7)+'px'; lbl.style.left='4px'; lbl.style.fontSize='10px'; lbl.style.color='var(--ink-soft)';
    gridWrap.appendChild(lbl);
  }
  // clickable empty half-hour slots (behind blocks) to create a booking at that time
  for(let h=HOUR_START; h<HOUR_END; h++){
    [0,30].forEach(mm=>{
      const y=(h-HOUR_START)*ROW_H + (mm/60)*ROW_H;
      const slot = el('button','tap'); slot.style.position='absolute'; slot.style.top=y+'px'; slot.style.left=LABEL_W+'px'; slot.style.right='0'; slot.style.height=(ROW_H/2)+'px'; slot.style.zIndex='1'; slot.style.border='none'; slot.style.background='transparent';
      const timeStr = String(h).padStart(2,'0')+':'+String(mm).padStart(2,'0');
      slot.onclick=()=>openAgendaFormAt(timeStr);
      gridWrap.appendChild(slot);
    });
  }
  // current time indicator (only if viewing today)
  if(state.agenda.date===todayKeyNow()){
    const now=new Date(); const nowMin=now.getHours()*60+now.getMinutes();
    if(nowMin>=HOUR_START*60 && nowMin<=HOUR_END*60){
      const y=(nowMin-HOUR_START*60)/60*ROW_H;
      const nowLine=el('div'); nowLine.style.position='absolute'; nowLine.style.top=y+'px'; nowLine.style.left=LABEL_W+'px'; nowLine.style.right='0'; nowLine.style.height='2px'; nowLine.style.background='var(--rose)'; nowLine.style.zIndex='2';
      const dot=el('div'); dot.style.position='absolute'; dot.style.top=(y-3)+'px'; dot.style.left=(LABEL_W-3)+'px'; dot.style.width='8px'; dot.style.height='8px'; dot.style.borderRadius='999px'; dot.style.background='var(--rose)'; dot.style.zIndex='2';
      gridWrap.appendChild(nowLine); gridWrap.appendChild(dot);
    }
  }
  // appointment blocks
  dayItems.forEach(ag=>{
    const startMin=timeToMinutes(ag.startTime), endMin=timeToMinutes(ag.endTime);
    const top=(startMin-HOUR_START*60)/60*ROW_H;
    const height=Math.max(30, (endMin-startMin)/60*ROW_H - 2);
    const [statusLabel, textColor, borderColor, bg] = AGENDA_STATUS_MAP[ag.status] || AGENDA_STATUS_MAP.agendado;
    const block = el('button','tap text-left'); block.style.position='absolute'; block.style.top=top+'px'; block.style.left=(LABEL_W+4)+'px'; block.style.right='4px'; block.style.height=height+'px';
    block.style.background=bg; block.style.border='1px solid '+borderColor; block.style.borderLeft='3px solid '+textColor; block.style.borderRadius='8px'; block.style.padding='4px 7px'; block.style.overflow='hidden'; block.style.zIndex='3';
    if(state.agenda.selectedId===ag.id){ block.style.boxShadow='0 0 0 2px var(--rose)'; }
    block.innerHTML = `<p class="text-xs font-semibold" style="color:${textColor}">${ag.startTime} · ${ag.clientName||'(sem cliente)'}${ag.bookedBy==='pro'?' <span style="opacity:.6">(pro)</span>':''}</p>${height>38?`<p class="text-xs opacity-70" style="color:${textColor}">${ag.serviceLabel}</p>`:''}`;
    block.onclick=()=>selectAgendaItem(ag.id);
    gridWrap.appendChild(block);
  });

  outer.appendChild(gridWrap);
  return outer;
}

function renderReports(){
  const wrap=el('div');
  wrap.appendChild(backButton(goHome));
  wrap.appendChild(el('h2','text-xl font-bold mb-1','Relatórios'));
  wrap.appendChild(el('p','text-xs opacity-60 mb-4','Comparativo de margem por hora entre serviços'));

  const periods = [['7d','7 dias'],['30d','30 dias'],['month','este mês'],['all','tudo']];
  const periodRow = el('div','flex flex-wrap gap-2 mb-4');
  periods.forEach(([key,label])=>{
    const b = el('button','tap chip px-3 py-2 rounded-full text-sm bg-white shadow-sm', label);
    b.style.border='1px solid var(--rose-light)';
    if(state.reportsPeriod===key) b.classList.add('active');
    b.onclick=()=>setReportsPeriod(key);
    periodRow.appendChild(b);
  });
  wrap.appendChild(periodRow);

  const exportBtn = el('button','tap w-full text-center py-3 rounded-xl text-sm font-medium mb-4','Exportar CSV (todo o histórico)');
  exportBtn.style.background='var(--rose-light)'; exportBtn.style.color='var(--rose-dark)';
  exportBtn.onclick=exportCsv;
  wrap.appendChild(exportBtn);

  const filtered = reportsFilterRecords(state.reportsPeriod);
  if(!filtered.length){
    wrap.appendChild(el('p','text-sm opacity-60','Nenhum atendimento nesse período ainda.'));
    return wrap;
  }
  const stats = computeServiceStats(filtered);
  const totalFat = stats.reduce((a,s)=>a+s.fat,0);
  const totalMargem = stats.reduce((a,s)=>a+s.margem,0);
  const totalHoras = stats.reduce((a,s)=>a+s.horas,0);

  const summary = el('div','rounded-2xl p-4 mb-4 shadow-sm'); summary.style.background='white'; summary.style.border='1px solid var(--rose-light)';
  summary.innerHTML = `
    <div class="grid grid-cols-3 gap-2 text-sm text-center">
      <div><span class="opacity-60 text-xs">Faturado</span><br><b>${fmtMoney(totalFat)}</b></div>
      <div><span class="opacity-60 text-xs">Margem</span><br><b style="color:var(--green)">${fmtMoney(totalMargem)}</b></div>
      <div><span class="opacity-60 text-xs">Horas</span><br><b>${totalHoras.toFixed(1)}h</b></div>
    </div>`;
  wrap.appendChild(summary);

  // tempo na cadeira por serviço
  const totalMinAll = stats.reduce((a,s)=>a+s.min,0)||1;
  const byTime = stats.slice().sort((a,b)=>b.min-a.min);
  wrap.appendChild(el('p','text-sm font-semibold mb-1','Tempo na cadeira por serviço'));
  wrap.appendChild(el('p','text-xs opacity-60 mb-2','Quanto cada serviço ocupa da sua agenda (atendimentos com vários serviços são separados pelo cronômetro).'));
  const tbox = el('div','rounded-2xl p-3 mb-5 bg-white shadow-sm'); tbox.style.border='1px solid var(--hairline)';
  byTime.forEach(s=>{
    const pct = Math.round(s.min/totalMinAll*100);
    const line = el('div','mb-3');
    line.innerHTML = `<div class="flex justify-between text-sm"><span class="font-medium">${s.label}</span><b>${(s.min/60).toFixed(1)}h · ${pct}%</b></div>
      <div style="height:6px;border-radius:6px;background:var(--rose-light);margin:4px 0"><div style="height:6px;border-radius:6px;background:var(--rose);width:${Math.max(2,pct)}%"></div></div>
      <p class="text-xs opacity-60">${s.n}x · média ${s.avgDuration} min · menor ${s.minMin} · maior ${s.maxMin} min</p>`;
    tbox.appendChild(line);
  });
  wrap.appendChild(tbox);
  wrap.appendChild(el('p','text-sm font-semibold mb-2','Margem por hora de cada serviço'));

  stats.forEach((s, i)=>{
    const svc = serviceById(s.serviceId);
    const isBest = i===0 && stats.length>1;
    const isWorst = i===stats.length-1 && stats.length>1;
    const row = el('div','rounded-xl p-3 mb-2 shadow-sm');
    row.style.background='white';
    row.style.border = isBest ? '1px solid var(--green)' : isWorst ? '1px solid var(--danger-border)' : '1px solid var(--hairline)';
    const durCompare = svc && svc.estimatedMin
      ? `tempo médio real: ${s.avgDuration} min (estimado ${svc.estimatedMin} min)`
      : `tempo médio real: ${s.avgDuration} min`;
    row.innerHTML = `
      <div class="flex items-center justify-between mb-1">
        <span class="font-semibold text-sm">${s.label} ${isBest?'<span class="badge badge-good">melhor margem</span>':''}${isWorst?'<span class="badge badge-warn">atenção</span>':''}</span>
        <span class="text-sm font-bold" style="color:${isBest?'var(--green)':isWorst?'var(--danger)':'var(--rose-dark)'}">${fmtMoney(s.margemHora)}/h</span>
      </div>
      <p class="text-xs opacity-60">${s.n} atend. · ${s.horas.toFixed(1)}h · faturado ${fmtMoney(s.fat)} · margem ${fmtMoney(s.margem)}</p>
      <p class="text-xs opacity-50 mt-1">${durCompare}</p>
    `;
    wrap.appendChild(row);
  });

  return wrap;
}

  wrap.appendChild(el('p','text-sm font-semibold mb-1 mt-2', iconLabel('clock','Lembrete de amanhã')));
  const tplBox2 = el('textarea','w-full rounded-lg px-2 py-2 text-xs mb-2');
  tplBox2.style.border='1px solid var(--rose-light)'; tplBox2.rows=2;
  tplBox2.value = config.reminderTemplate;
  tplBox2.onchange = (e)=>saveConfig({reminderTemplate:e.target.value});
  wrap.appendChild(tplBox2);
  wrap.appendChild(el('p','text-xs opacity-40 mb-2','Use {nome}, {hora} e {servico}.'));

  const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate()+1);
  const tomorrowKey = localKey(tomorrow);
  const tomorrowAg = agendamentos.filter(a=>a.date===tomorrowKey && (a.status==='agendado'||a.status==='confirmado'))
    .sort((a,b)=>timeToMinutes(a.startTime)-timeToMinutes(b.startTime));
  if(!tomorrowAg.length){
    wrap.appendChild(el('p','text-sm opacity-60 mb-4','Nenhum agendamento pra amanhã ainda.'));
  } else {
    const list2 = el('div','space-y-2 mb-4');
    tomorrowAg.forEach(ag=>{
      const msg = config.reminderTemplate.replace('{nome}',ag.clientName||'').replace('{hora}',ag.startTime).replace('{servico}',ag.serviceLabel);
      const c = clients.find(c=>c.id===ag.clientId);
      const link = c ? waLink(c.whatsapp, msg) : null;
      const row = el('div','rounded-xl px-3 py-2 bg-white shadow-sm');
      row.style.border='1px solid var(--rose-light)';
      const top = el('div','flex items-center justify-between mb-1');
      top.innerHTML = `<div><p class="font-medium text-sm">${ag.startTime} · ${ag.clientName||'(sem cliente)'}</p><p class="text-xs opacity-60">${ag.serviceLabel}</p></div>`;
      row.appendChild(top);
      const preview = el('p','text-xs opacity-70 mb-2 p-2 rounded-lg', msg);
      preview.style.background='var(--cream)'; preview.style.whiteSpace='pre-wrap';
      row.appendChild(preview);
      const btnRow = el('div','flex gap-2');
      if(link){
        const a = el('a','tap text-xs px-3 py-2 rounded-lg text-white','Enviar no WhatsApp');
        a.href=link; a.target='_blank'; a.style.background='var(--rose)';
        btnRow.appendChild(a);
      } else {
        btnRow.appendChild(el('span','text-xs opacity-40 px-1 py-2','sem WhatsApp cadastrado'));
      }
      btnRow.appendChild(copyButton(msg));
      row.appendChild(btnRow);
      list2.appendChild(row);
    });
    wrap.appendChild(list2);
  }

  // --- Pontos de fidelidade ---
  wrap.appendChild(el('p','text-sm font-semibold mb-1 mt-2', iconLabel('star','Pontos de fidelidade (informal)','var(--amber)')));
  wrap.appendChild(el('p','text-xs opacity-60 mb-2', `1 ponto a cada R$ ${config.pontosPorReal} gastos (controle manual, sem resgate automático)`));
  if(!clients.length){
    wrap.appendChild(el('p','text-sm opacity-60 mb-4','Nenhuma cliente cadastrada ainda.'));
  } else {
    const withPoints = clients.map(c=>({c, pontos: Math.floor(clientTotalFat(c.id)/(config.pontosPorReal||10))}))
      .filter(x=>x.pontos>0).sort((a,b)=>b.pontos-a.pontos);
    if(!withPoints.length) wrap.appendChild(el('p','text-sm opacity-60 mb-4','Ainda sem pontos acumulados.'));
    else {
      const list3 = el('div','space-y-1 mb-4');
      withPoints.forEach(({c,pontos})=>{
        list3.appendChild(el('div','flex justify-between text-sm bg-white rounded-lg px-3 py-2 shadow-sm', `<span>${c.name}</span><b>${pontos} pts</b>`));
      });
      wrap.appendChild(list3);
    }
  }

  const note = el('p','text-xs opacity-50 mt-2','Cupom de desconto e vale-presente do Trinks não entraram aqui de propósito — descontos recorrentes vão contra o posicionamento do studio (evitar competir por preço). Se ainda assim quiser isso, me avisa que eu construo.');
  wrap.appendChild(note);

  return wrap;
}

// ---------- start ----------
let gcalAvailable = false;
getGcal().then(mcp=>{ if(mcp){ gcalAvailable=true; render(); } });
initDb();
render();
if('serviceWorker' in navigator){ window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }
</script>
